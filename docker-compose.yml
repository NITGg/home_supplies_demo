services:
  redis:
    image: redis:7-alpine
    container_name: tawreedat_go_adminAPIs
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # command to ensure persistence is active
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

volumes:
  redis_data:
